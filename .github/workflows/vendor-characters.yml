name: Incorporar personaje animado de alta calidad
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vendor-characters.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Descargar humanoide Soldier GLB desde Three.js
        run: |
          mkdir -p assets/models
          curl -fL --retry 4 --connect-timeout 20 --max-time 120 \
            https://raw.githubusercontent.com/mrdoob/three.js/r164/examples/models/gltf/Soldier.glb \
            -o assets/models/soldier.glb
          test "$(wc -c < assets/models/soldier.glb)" -gt 1500000
          test "$(head -c 4 assets/models/soldier.glb)" = glTF
          sha256sum assets/models/soldier.glb
      - name: Guardar archivo local en repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/soldier.glb
          if ! git diff --cached --quiet; then
            git commit -m "assets: vendor animated soldier glTF with idle walk run clips"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
